name: pc-member-review
version: 1.0.0
description: The composed final step — merge every upstream review artifact into deduplicated, independently verified review points, then render the submission-ready review behind two human gates.

inputs:
  - name: paper
    description: paper.json produced by paper-ingest
    type: string
    default: ../paper-ingest/paper/paper.json

  - name: venue
    description: venue.json produced by venue-intake; its review_form drives the final output
    type: string
    default: ../venue-intake/venue/venue.json

  - name: overall_reviews
    description: overall-reviews.json produced by overall-review
    type: string
    default: ../overall-review/reviews/overall-reviews.json

  - name: section_reviews
    description: section-reviews.json produced by section-review
    type: string
    default: ../section-review/reviews/section-reviews.json

  - name: related_work
    description: >-
      related-work.json produced by related-work. Optional — picked up automatically
      from a sibling directory when present, skipped when absent.
    type: string
    default: ../related-work/related/related-work.json

  - name: pc_citations
    description: >-
      pc-citations.json produced by pc-citation-scan. Optional, and normally only useful
      to an author rather than a reviewer — picked up automatically from a sibling
      directory when present, skipped when absent.
    type: string
    default: ../pc-citation-scan/citations/pc-citations.json

  - name: paper_id
    description: Stable identifier, matching the one in paper.json
    type: string
    default: submission

  - name: aggregator_target
    description: Agent target that merges reviews into addressable points and renders the report
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: verifier_target
    description: Agent target that independently checks every point against the paper. Use a different model from the aggregator — a model checking its own output is not an independent check.
    type: string
    format: execution-target
    default: codex[high]:openai:gpt-5.6-sol

  - name: render_passes
    description: How many times the report may be sent back for revision at the final gate
    type: number
    default: 3

  - name: repair_target
    description: Agent target that repairs schema violations
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: repair_attempts
    description: How many times the agent may repair the artifact before the run stops for a human
    type: number
    default: 2
  - name: agent_timeout
    description: Per-agent wall-clock timeout, e.g. "30m" or "2h"
    type: string
    default: 30m

  - name: agents_json
    description: >-
      JSON object declaring the agent programs your selectors refer to, written verbatim
      into .agents/rhei/settings.json. Any agent named in a selector must be declared here
      or in your global rhei settings, including the modes used in brackets — an undeclared
      agent or mode fails instantiation. Supply with --set-file agents_json=<file>. The
      default declares `codex`; `claude-code` and other built-ins need no declaration.
    type: string
    default: |
      {
        "codex": {
          "command": ["codex", "exec"],
          "model_flag": "--model",
          "stdin_prompt": true,
          "mcp_flag": "--mcp",
          "modes": {
            "yolo": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\""],
            "high": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"high\""],
            "xhigh": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"xhigh\""]
          }
        }
      }
