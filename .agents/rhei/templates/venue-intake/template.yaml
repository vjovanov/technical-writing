name: venue-intake
version: 1.0.0
description: Resolve a venue reference into the schema-validated venue.json (scope, process, review form) and program-committee.json (the full PC roster).

inputs:
  - name: conference
    description: Venue reference — the conference website URL (preferred), a local file with venue information, or just the venue name
    type: string
    positional: 1

  - name: guidelines
    description: Reviewer guidelines verbatim (--set-file guidelines=<file>); harvested from the venue when omitted
    type: string
    default: ""

  - name: review_form
    description: Offline review form verbatim, e.g. a HotCRP "==+==" text form (--set-file review_form=<file>); harvested from the venue when omitted
    type: string
    default: ""

  - name: harvest_pc
    description: Whether to harvest the program committee roster; set false when the venue publishes no PC or you do not need reviewer matching
    type: boolean
    default: true

  - name: intake_target
    description: Agent target that resolves the venue and harvests the committee
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: repair_attempts
    description: How many times the agent may repair an artifact after a schema-validation failure before the run stops for a human
    type: number
    default: 2

  - name: agent_timeout
    description: Per-agent wall-clock timeout, e.g. "30m" or "2h"
    type: string
    default: 30m

  - name: agents_json
    description: >-
      JSON object declaring the agent programs your selectors refer to, written verbatim
      into .agents/rhei/settings.json. Any agent named in a selector must be declared here
      or in your global rhei settings, including the modes used in brackets — an undeclared
      agent or mode fails instantiation. Supply with --set-file agents_json=<file>. The
      default declares `codex`; `claude-code` and other built-ins need no declaration.
    type: string
    default: |
      {
        "codex": {
          "command": ["codex", "exec"],
          "model_flag": "--model",
          "stdin_prompt": true,
          "mcp_flag": "--mcp",
          "modes": {
            "yolo": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\""],
            "high": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"high\""],
            "xhigh": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"xhigh\""]
          }
        }
      }
