name: overall-review
version: 1.0.0
description: Review a whole paper from several configurable reviewer personalities in parallel, merged into a schema-validated overall-reviews.json.

inputs:
  - name: paper
    description: paper.json produced by paper-ingest
    type: string
    default: ../paper-ingest/paper/paper.json

  - name: venue
    description: venue.json produced by venue-intake
    type: string
    default: ../venue-intake/venue/venue.json

  - name: related_work
    description: >-
      related-work.json produced by related-work. Optional — if you ran that template
      into a sibling directory it is picked up automatically, and if you did not, the
      review still runs without it.
    type: string
    default: ../related-work/related/related-work.json

  - name: paper_id
    description: Stable identifier, matching the one in paper.json
    type: string
    default: submission

  - name: personalities
    description: Reviewer personalities. Each reviews the whole paper independently, with its own stance, from its own target.
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          validate: "[a-z][a-z0-9-]*"
        label:
          type: string
        selector:
          type: string
          format: execution-target
        stance:
          type: string
    default:
      - id: academic
        label: Academic reviewer
        selector: claude-code[yolo]:anthropic:claude-opus-5
        stance: >-
          You are a professor at a research university reviewing for a top-tier venue.
          Prioritize novelty, technical soundness, and empirical rigor. Be critical but
          fair, distinguish major from minor concerns, and never dismiss work you simply
          find unfashionable. Do not invent experimental results, and do not claim a
          missing citation unless you can name a plausible candidate.
      - id: industry-friendly
        label: Industry-friendly reviewer
        selector: claude-code[yolo]:anthropic:claude-opus-5
        stance: >-
          You are a principal engineer who ships production compilers. Default toward
          acceptance with concrete revisions. Look for practical relevance, honest
          cost/benefit trade-offs, and engineering realism. Every criticism you make
          must come with a concrete improvement path that fits one revision cycle.
      - id: industry-skeptical
        label: Industry-skeptical reviewer
        selector: codex[high]:openai:gpt-5.6-sol
        stance: >-
          You are a performance architect who has been burned by overstated results.
          Default toward rejection unless the evidence is strong. Attack claim-to-evidence
          alignment sentence by sentence: unfair baselines, missing ablations, absent
          variance, cherry-picked benchmarks. Do not fabricate flaws — every objection
          must cite concrete text or a concrete experimental gap.

  - name: merge_target
    description: Agent target that merges the per-personality reviews into one artifact
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: repair_target
    description: Agent target that repairs schema violations
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: repair_attempts
    description: How many times the agent may repair the artifact before the run stops for a human
    type: number
    default: 2

  - name: agent_timeout
    description: Per-agent wall-clock timeout, e.g. "30m" or "2h"
    type: string
    default: 30m

  - name: agents_json
    description: >-
      JSON object declaring the agent programs your selectors refer to, written verbatim
      into .agents/rhei/settings.json. Any agent named in a selector must be declared here
      or in your global rhei settings, including the modes used in brackets — an undeclared
      agent or mode fails instantiation. Supply with --set-file agents_json=<file>. The
      default declares `codex`; `claude-code` and other built-ins need no declaration.
    type: string
    default: |
      {
        "codex": {
          "command": ["codex", "exec"],
          "model_flag": "--model",
          "stdin_prompt": true,
          "mcp_flag": "--mcp",
          "modes": {
            "yolo": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\""],
            "high": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"high\""],
            "xhigh": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"xhigh\""]
          }
        }
      }
