name: paper-ingest
version: 1.0.0
description: Read one submission once — from a PDF or a LaTeX source tree — and emit the schema-validated paper.json every other paper-pipeline template consumes.

inputs:
  - name: paper
    description: The submission — a PDF file, a LaTeX main file, or a directory containing LaTeX sources
    type: string
    positional: 1

  - name: paper_id
    description: Stable identifier used in filenames and in every downstream artifact (e.g. "submission-42")
    type: string
    default: submission

  - name: source_kind
    description: Which ingest path to take — "auto" detects from the path, "pdf" renders and reads pages, "latex" flattens and reads the source
    type: string
    default: auto
    validate: "auto|pdf|latex"

  - name: render_dpi
    description: Resolution for per-page PNG rendering on the PDF path
    type: number
    default: 150

  - name: ingest_target
    description: Agent target that reads the paper and writes the artifacts
    type: string
    format: execution-target
    default: claude-code[yolo]:anthropic:claude-opus-5

  - name: repair_attempts
    description: How many times the agent may repair paper.json after a schema-validation failure before the run stops for a human
    type: number
    default: 2

  - name: agent_timeout
    description: Per-agent wall-clock timeout, e.g. "30m" or "2h"
    type: string
    default: 30m

  - name: agents_json
    description: >-
      JSON object declaring the agent programs your selectors refer to, written verbatim
      into .agents/rhei/settings.json. Any agent named in a selector must be declared here
      or in your global rhei settings, including the modes used in brackets — an undeclared
      agent or mode fails instantiation. Supply with --set-file agents_json=<file>. The
      default declares `codex`; `claude-code` and other built-ins need no declaration.
    type: string
    default: |
      {
        "codex": {
          "command": ["codex", "exec"],
          "model_flag": "--model",
          "stdin_prompt": true,
          "mcp_flag": "--mcp",
          "modes": {
            "yolo": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\""],
            "high": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"high\""],
            "xhigh": ["--sandbox", "workspace-write", "--skip-git-repo-check", "-c", "approval_policy=\"on-request\"", "-c", "model_reasoning_effort=\"xhigh\""]
          }
        }
      }
