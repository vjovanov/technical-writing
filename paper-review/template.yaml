name: paper-review
version: 1.1
description: Multi-model conference paper review — venue and paper ingest, related-work search, per-section review fan-out, aggregation into verified addressable points, and a human-gated final report.

inputs:
  - name: paper
    description: The submission under review — a PDF file, or a LaTeX main file / source directory
    type: path
    positional: 1

  - name: paper_id
    description: Identifier used in output filenames (e.g. the paper number, "42"); when empty, derived from the paper filename stem (e.g. "submission-42")
    type: string
    default: ""

  - name: conference
    description: Venue reference — the conference website URL (preferred; venue info, guidelines, and review form are harvested from it), a local file with venue information, or just the venue name
    type: string

  - name: guidelines
    description: Optional reviewer guidelines, verbatim (--set-file guidelines=<file>); when omitted, harvested from the venue website
    type: string
    default: ""

  - name: review_form
    description: Optional verbatim offline-review form (e.g. a HotCRP "==+==" text form; --set-file review_form=<file>); when omitted, harvested from the venue website or defaulted to a standard field set
    type: string
    default: ""

  - name: reviewers
    description: Reviewer models that independently write the overall summary and review every topic (override with --values)
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          validate: "[a-z][a-z0-9-]*"
        label:
          type: string
        selector:
          type: string
    default:
      - id: codex
        label: Codex (GPT 5.6 Sol, high reasoning)
        selector: codex[high]:openai:gpt-5.6-sol
      - id: claude
        label: Claude (Opus 4.8)
        selector: claude-code[yolo]:anthropic:claude-opus-4-8

  - name: aggregator_target
    description: Best-model target that merges all reviews into addressable points and renders the final report
    type: string
    default: claude-code[yolo]:anthropic:claude-opus-4-8

  - name: verifier_target
    description: Target that independently verifies every aggregated point against the paper before the human gate
    type: string
    default: claude-code[yolo]:anthropic:claude-opus-4-8

  - name: utility_target
    description: Claude target used for paper ingestion, related-work search, and review planning
    type: string
    default: claude-code[yolo]:anthropic:claude-opus-4-8

  - name: max_related
    description: Maximum number of related papers to index and download
    type: number
    default: 10
